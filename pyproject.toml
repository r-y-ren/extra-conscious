[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "extra-conscious"
version = "0.1.0"
description = "Six-stage verifiable reconnaissance, skill retrieval, and research-backed execution CLI (recon)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1.0",
  "httpx>=0.27.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
embed = [
  "sentence-transformers>=3.0.0",
]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
recon = "recon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
